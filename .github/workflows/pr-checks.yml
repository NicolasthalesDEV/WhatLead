# Pull Request Checks
# Lightweight checks that run on every PR

name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel previous runs when new commit is pushed
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # Quick validation checks
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better diffs

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check || echo "::warning::Code needs formatting. Run 'pnpm format'"
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build check
        run: pnpm build
        env:
          JWT_SECRET: dummy-secret-for-build
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  # Check if PR is ready to merge
  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: quick-checks
    steps:
      - name: PR is ready
        run: |
          echo "✅ All checks passed!"
          echo "PR is ready for review"

  # Comment on PR with useful info
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: quick-checks
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.quick-checks.result }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = status === 'success' 
              ? 'All checks passed! Ready for review.' 
              : 'Some checks failed. Please review the logs.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **CI/CD Status**: ${message}\n\n[View Details](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
